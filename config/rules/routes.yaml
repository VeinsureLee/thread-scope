# ============================================================
# 通用规则 — 论坛路由模板
# ============================================================
# 本文件描述论坛各功能页面的 URL 路径模板。
# 花括号 {xxx} 表示运行时替换的变量，由程序拼接。
# 修改此文件即可适配同版本论坛的路径变更，无需改源码。
# ============================================================

# ── 认证 ──
index: "/index"                                 # 首页（获取 guest cookie）
login: "/user/ajax_login.json"                  # AJAX 登录接口（POST）

# ── 论坛浏览 ──
# 分区 AJAX 接口：递归获取树状结构
#   root=list-section → 根级（一级讨论区）
#   root={parentId}   → 该区下的子节点（可能是子讨论区或版块）
sections_ajax: "/section/ajax_list.json"         # AJAX 分区/子区/版块列表（JSON）
# section_detail 需要数字 ID：sec-0 → /section/0
section_detail: "/section/{sectionId}"           # 分区/版块详情页（HTML）

# ── 版块文章 ──
board_articles: "/board/{boardName}"             # 版块文章列表页
# 帖子详情页：/{board}/{id}，楼层分页 ?p={n}
#   例：/article/Demo/1001 → 首帖；/article/Demo/1001?p=2 → 第 2 页楼层
thread_detail: "/article/{board}/{id}"

# ── 版面内搜索（/s/article） ──
# 参数：b=版面ename、t1=关键字、au=作者ID(可选)、m=精华帖、a=带附件
#   例：/s/article?b=Demo&t1=keyword
search_path: "/s/article"

# ── 用户相关（用于页面解析时的链接匹配） ──
user_query: "/user/query/"                      # 用户信息页前缀（详情页内 /user/query/{uid} 弹窗）

# ── 分区树递归参数 ──
tree_root_param: "list-section"                  # 根级参数值：root=list-section
tree_recursive_param: "root"                     # 递归参数名：root={parentId}

# ── 版块流量（可选 &count=1 参数） ──
count_param: "&count=1"                         # 附加此参数时返回 HTML（含流量）
