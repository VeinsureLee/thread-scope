# ============================================================
# 通用规则 — HTTP 请求默认参数
# ============================================================
# 本文件定义 HTTP 请求的默认行为，模拟浏览器访问。
# 修改此文件即可调整请求策略（超时、重试、头信息等）。
# ============================================================

# ── 默认请求头（模拟浏览器） ──
headers:
  User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  Accept-Language: "zh-CN,zh;q=0.9"

# ── AJAX 请求额外头 ──
ajax_headers:
  X-Requested-With: "XMLHttpRequest"

# ── 请求超时（毫秒） ──
timeout_ms: 15000

# ── 默认编码（目标论坛使用 GBK） ──
default_encoding: "gbk"
