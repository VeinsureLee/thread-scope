# ============================================================
# 通用规则 — HTTP 请求默认参数
# ============================================================
# 本文件定义 HTTP 请求的默认行为，模拟浏览器访问。
# 修改此文件即可调整请求策略（超时、重试、头信息等）。
# ============================================================

# ── 默认请求头（模拟浏览器） ──
headers:
  User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  Accept-Language: "zh-CN,zh;q=0.9"

# ── AJAX 请求额外头 ──
ajax_headers:
  X-Requested-With: "XMLHttpRequest"

# ── 请求超时（毫秒） ──
timeout_ms: 15000

# ── 默认编码（目标论坛使用 GBK） ──
default_encoding: "gbk"

# ── 请求限速（毫秒）：每两次实际请求的最小间隔 ──
# 全站共享同一限速队列（PageFetcher 令牌队列），并发再高也不会超过
# 1 秒内请求数 = 1000 / request_interval_ms。默认 10ms → 100 req/s。
request_interval_ms: 10

# ── 异步并发（工作池） ──
# 同时"在途"的独立任务数上限（跨版面搜索 / 帖子正文抓取 / 分区流量采集）。
# 并发度提高墙钟缩短，但请求频率仍受上面 request_interval_ms 硬约束。
# 默认 8（约 14 req/s，全站搜索约 20s）；上限建议 16。
concurrency:
  # 默认并发度
  default: 8
  # 允许用户设置的最大并发度（工具参数 zod 上限）
  max: 16

# ── 用户资料（docs/06） ──
user:
  # 用户资料 TTL（小时）：批量抓取时，profile_fetched_at 距今 < TTL 的用户跳过（不重抓）。
  # 等级/积分等会变，TTL 到期后重抓覆盖更新；force=true 可强制重抓。
  profile_ttl_hours: 72

# ── 会话过期检测 ──
# 会话过期后，目标站点会把受保护页面换成“未登录/登录引导”页。若继续按正常页面解析，
# 会静默产出空结果（对 LLM 宿主表现为“搜不到”，极难诊断）。PageFetcher 拿到 HTML 后
# 按以下特征检测：
# - html_signals（强）：命中任一 → 判定会话失效，立即抛错（不重试）并清除本地 Cookie，
#   提示重新调用 forum-login。请按目标站点真实的未登录页调整（宁缺勿滥，避免误判）。
# - suspicious_signals（弱）：命中任一 → 仅记 warn 日志（用于选择器失效/站点改版诊断）。
session_expired:
  html_signals:
    - "user/login"
    - "id=\"login_box\""
    - "name=\"passwd\""
  suspicious_signals:
    - "请登录"
    - "登录后"
    - "login_form"
